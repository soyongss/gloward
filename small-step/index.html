/* ==========================================================
   Small Step — 추가·수정 스타일
   원본 index.B-MS3jXX.css 뒤에 붙는 덮어쓰기 층.
   섹션: 1 생성 폼 · 2 본주 보드 · 3 오늘 · 4 기록 · 5 공통/모바일
   ========================================================== */

/* ---------- 1. 생성 폼 (我的 Small Steps) ---------- */

/* 요일 단축 버튼 */
.day-presets{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.day-presets button{
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer;
}
.day-presets button:hover{border-color:var(--green);color:var(--green)}

/* 연쇄 루틴 선택 (02번 조건형) — 부모 그리드의 오른쪽 열에 배치 */
.start-choice>.chain-picker,.start-choice>.slot-picker{grid-column:2;min-width:0}
.chain-picker{display:grid;gap:8px;margin:4px 0 10px}
.chain-picker>span{letter-spacing:.06em;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.chain-options{display:flex;flex-wrap:wrap;gap:7px}
.chain-options button{
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer;max-width:220px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chain-options button.active{border-color:var(--green);background:var(--soft);color:var(--green);font-weight:600}

/* 우측 패널 진행 표시 */
.week-progress-line{margin:6px 0 0;color:var(--green);font-weight:600;font-size:13px;letter-spacing:.04em}

/* ---------- 2. 본주 보드 (本周) ---------- */

/* 주 이동 — 원본 날짜 알약과 한 덩어리로 */
.plan-heading{grid-template-columns:minmax(0,1fr);min-height:0;gap:0}
.plan-heading>div{max-width:760px}
.week-nav{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px;
}
.week-nav .week-date{margin:0 !important;order:2}
.week-nav button{
  order:1;width:34px;height:34px;padding:0;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #c9d1b5;background:#fffdf7a3;color:var(--green);
  font-size:14px;line-height:1;cursor:pointer;
  transition:background .16s,border-color .16s,transform .16s;
}
.week-nav button:nth-of-type(2){order:3}
.week-nav button:hover{background:var(--soft);border-color:var(--green);transform:translateY(-1px)}
.week-nav .week-back{
  order:4;width:auto;height:30px;padding:0 14px;border-radius:999px;
  border-color:var(--line);color:var(--muted);font-size:11px;
}
.week-nav .week-date b{
  margin-left:8px;padding:2px 8px;border-radius:999px;
  background:var(--green);color:#fffdf7;font-size:9px;font-weight:800;letter-spacing:.1em;
}

/* Small Step 목록 — 카드 정렬 */
.routine-legend{align-items:center !important}
.routine-legend>span{
  align-self:center;background:0 0;border:0;color:var(--muted);
  white-space:nowrap;padding:0 4px 0 0 !important;
}
.routine-legend p{align-content:center}

/* 상단 Small Step 목록 — 이름·설명이 카드 밖으로 넘치던 것 수정 */
.routine-legend p{
  white-space:normal;
  flex-wrap:wrap;
  align-items:center;
}
.routine-legend p>i{flex-shrink:0}
.routine-legend small{
  flex-basis:100%;
  margin:6px 0 0 33px;
  line-height:1.5;
  word-break:break-word;
}

/* 연쇄 루틴 표시 (부모 아래 들여쓰기) */
.agenda-group article.chained,
.routine-today-list article.chained{margin-left:16px;position:relative}
.agenda-group article.chained:before,
.routine-today-list article.chained:before{
  content:"";position:absolute;left:-11px;top:-4px;bottom:8px;width:1px;background:var(--line);
}
.chain-mark{font-style:normal;color:var(--green);opacity:.65;font-size:11px}

/* ---------- 3. 오늘 (今天) ---------- */

.saved-thoughts{margin-top:14px;display:grid;gap:8px}
.saved-thoughts p{
  margin:0;padding:10px 14px;border-radius:12px;background:var(--soft);
  color:var(--ink);font-size:13px;line-height:1.6;
}

/* ---------- 4. 기록 (记录) ---------- */

/* 하루 카드 — 감상을 기록 오른쪽으로, 추가 일정은 아래로 */
@media (min-width:801px){
  .record-card{align-items:start}
  .record-card>header{grid-row:1/3}
  .record-card .record-routines{grid-column:2;grid-row:1}
  .record-card blockquote{grid-column:3;grid-row:1;height:100%}
  .record-card .record-todos{grid-column:2/4;grid-row:2}
}

/* 삭제 버튼 톤 다운 */
.record-card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.record-card .delete-record{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:999px;padding:4px 11px;font-size:11px;text-decoration:none;
  opacity:.55;transition:opacity .18s,border-color .18s,color .18s;cursor:pointer;
}
.record-card:hover .delete-record{opacity:1}
.record-card .delete-record:hover{border-color:#b98a7a;color:#a8705f}

/* 一周感想 저장 버튼 */
.weekly-reflection-actions{display:flex;justify-content:flex-end;margin-top:10px}
.weekly-save{
  border:1px solid var(--green);background:var(--green);color:#fff;
  border-radius:999px;padding:7px 20px;font-size:13px;cursor:pointer;transition:opacity .18s;
}
.weekly-save[disabled]{
  background:transparent;border-color:var(--line);color:var(--muted);cursor:default;opacity:.7;
}

/* ---------- 5. 공통 / 모바일 ---------- */

/* 탭별 빈 화면 */
.ss-empty-gate{
  max-width:520px;margin:80px auto 120px;padding:44px 32px;text-align:center;
  background:var(--paper);border:1px solid var(--line);border-radius:22px;
}
.ss-empty-gate p{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.7}
.ss-empty-gate .gate-hint{font-size:13px;opacity:.85;margin:-10px 0 22px}
.ss-empty-gate .primary{width:100%;max-width:280px;margin:0 auto}

/* ---------- 6. 오늘 · 기분 직접 입력 (칩 줄 안) ---------- */
.mood-add{border-style:dashed !important}
.mood-write{display:inline-flex;align-items:center;gap:6px}
.mood-write input{
  border:1px solid var(--green);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:5px 12px;font-size:12px;width:120px;
}
.mood-write-ok{
  border:1px solid var(--green);background:var(--green);color:#fff;
  border-radius:50%;width:26px;height:26px;font-size:12px;cursor:pointer;line-height:1;
}

/* ---------- 7. 기록 — 영수증 ---------- */
.record-card-wrap{margin-bottom:16px}

.day-receipt{
  --rc-plan:126px;          /* 设计 열 폭 */
  --rc-gap:14px;
  --rc-pad:28px;
  background:
    linear-gradient(#f4f4e7,#f4f4e7) 0 0/100% 74px no-repeat,
    #fffdf6;
  border:1px solid #dcd8c6;
  border-radius:10px 10px 0 0;
  padding:22px var(--rc-pad) 30px;
  font-family:ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace;
  position:relative;
}
.day-receipt:before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;
  border-radius:10px 10px 0 0;
  background:linear-gradient(90deg,#959871,#c5c99d);
}
/* 우표 밑단 — 지그재그 */
.day-receipt:after{
  content:"";position:absolute;left:-1px;right:-1px;bottom:-13px;height:14px;
  background:#fffdf6;
  -webkit-mask-image:linear-gradient(135deg,#0000 34%,#000 35%),linear-gradient(-135deg,#0000 34%,#000 35%);
  mask-image:linear-gradient(135deg,#0000 34%,#000 35%),linear-gradient(-135deg,#0000 34%,#000 35%);
  -webkit-mask-size:18px 14px;mask-size:18px 14px;
  -webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;
  -webkit-mask-position:0 0,9px 0;mask-position:0 0,9px 0;
  filter:drop-shadow(0 1px 0 #dcd8c6);
}

.day-receipt header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.day-receipt header b{letter-spacing:.2em;color:var(--green);font-size:11px;font-weight:700}
.day-receipt header small{
  color:#847367;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.06em;
}

.receipt-meta{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 0 14px;
}
.receipt-meta>span:first-child{
  background:#fffdf6;border:1px solid #c5c99d;color:#6b7052;
  border-radius:999px;padding:3px 12px;font-size:11px;font-weight:600;
}
.receipt-acts{display:flex;gap:6px}
.card-act,.day-receipt .delete-record{
  border:1px solid #cfcbb9;background:#fffdf6cc;color:var(--muted);
  border-radius:999px;padding:3px 10px;font-size:10.5px;cursor:pointer;
  opacity:.7;transition:opacity .18s,border-color .18s,color .18s;text-decoration:none;
}
.day-receipt:hover .card-act,.day-receipt:hover .delete-record{opacity:1}
.card-act:hover{border-color:var(--green);color:var(--green)}
.day-receipt .delete-record:hover{border-color:#b98a7a;color:#a8705f}

/* 표 — 세로 구분선은 한 줄로 이어짐 */
.receipt-table{
  position:relative;
  border-top:1px dashed #cfcbb9;
  padding-top:2px;
}
.receipt-table:before{
  content:"";position:absolute;top:0;bottom:0;
  left:calc(var(--rc-plan) + var(--rc-gap) / 2);
  width:1px;background:#d5d0be;
}
.receipt-cols,.receipt-rows p{
  display:grid;grid-template-columns:var(--rc-plan) 60px 1fr;column-gap:var(--rc-gap);align-items:baseline;
}
.receipt-cols{
  padding:10px 0 8px;letter-spacing:.14em;font-size:9px;font-weight:700;color:var(--muted);
}
.receipt-cols span:nth-child(2),.receipt-cols span:nth-child(3){color:#6b7052}
.receipt-rows p{margin:0;padding:8px 0;border-bottom:1px dotted #e6e2d4;font-size:12px}
.receipt-rows p:last-child{border-bottom:0}
.receipt-rows em{
  font-style:normal;color:#7c8471;font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.receipt-rows time{color:#6b7052;font-weight:600;font-variant-numeric:tabular-nums;font-size:11.5px}
.receipt-rows b{
  color:#3f463b;font-weight:500;font-size:12.5px;
  display:flex;flex-wrap:wrap;gap:3px 10px;align-items:baseline;
}
.receipt-rows b small{color:#8b9280;font-size:11px}
.receipt-rows p.undone{opacity:.5}
.receipt-rows p.undone time{color:#a9ae9f}

/* 감상 — 메모지 */
.receipt-notes{
  --note-line:26px;
  margin-top:18px;padding:14px 18px 10px;
  background:#f9f7ec;border-left:6px solid var(--sun);border-radius:0 12px 12px 0;
}
.receipt-notes>span{
  letter-spacing:.14em;color:#847367;font-size:9px;font-weight:700;display:block;margin-bottom:8px;
}
.receipt-notes p{
  margin:0;color:#55514f;font-size:13px;
  font-family:Georgia,Songti SC,serif;font-style:italic;
  line-height:var(--note-line);
  background:repeating-linear-gradient(
    #0000 0,#0000 calc(var(--note-line) - 1px),
    #dcdcc4 calc(var(--note-line) - 1px),#dcdcc4 var(--note-line));
  background-position:0 1px;
}

/* 편집 서랍 */
.record-edit{
  background:var(--paper);border:1px dashed var(--line);border-radius:14px;
  padding:18px 20px;margin:16px 0 0;display:grid;gap:18px;
}
.record-edit-block>span{
  letter-spacing:.16em;color:var(--green);font-size:9px;font-weight:800;display:block;margin-bottom:8px;
}
.edit-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.edit-row>b{font-size:13px;min-width:96px}
.edit-check{
  width:22px;height:22px;flex-shrink:0;border:1px solid var(--line);background:var(--paper);
  border-radius:50%;color:var(--green);font-size:11px;cursor:pointer;line-height:1;
}
.edit-check.on{background:var(--soft);border-color:var(--green)}
.edit-row input[type=time]{
  border:1px solid var(--line);background:var(--paper);border-radius:8px;
  padding:4px 8px;font-size:12px;font-variant-numeric:tabular-nums;
}
.edit-note{
  flex:1;min-width:150px;border:1px solid var(--line);background:var(--paper);
  border-radius:8px;padding:5px 10px;font-size:13px;
}
.edit-remove{border:0;background:0 0;color:var(--muted);font-size:15px;cursor:pointer;opacity:.5;padding:0 4px}
.edit-remove:hover{opacity:1;color:#a8705f}
.edit-add{display:flex;gap:7px;margin-top:8px}
.edit-add input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;font-size:13px}
.edit-add button{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;width:34px;font-size:14px;cursor:pointer}
.edit-empty{color:var(--muted);font-size:12px;margin:0}

@media (max-width:600px){
  .day-receipt{padding:20px 16px 26px}
  .day-receipt{--rc-plan:92px;--rc-gap:9px;--rc-pad:16px}
}

/* 조건형 루틴의 하루 중 위치 (早上 / 不指定 / 晚上) */
.slot-picker{display:grid;gap:8px;margin:10px 0 2px}
.slot-picker>span{letter-spacing:.06em;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.slot-options{display:flex;gap:7px;flex-wrap:wrap}
.slot-options button{
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:999px;padding:5px 15px;font-size:12px;cursor:pointer;white-space:nowrap;
}
.slot-options button.active{border-color:var(--green);background:var(--soft);color:var(--green);font-weight:600}
.slot-mini{display:flex;gap:4px;margin-top:6px}
.slot-mini button{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:7px;width:24px;height:22px;font-size:11px;cursor:pointer;line-height:1;opacity:.65;
}
.slot-mini button.active{border-color:var(--green);background:var(--soft);color:var(--green);opacity:1;font-weight:700}
.summary-range{display:block;margin-top:4px;color:var(--muted);font-size:11px}

/* 한 주 영수증 일괄 저장 */
.week-save-all{
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:999px;padding:6px 16px;font-size:12px;cursor:pointer;margin-top:10px;
  transition:border-color .16s,color .16s;
}
.week-save-all:hover{border-color:var(--green);color:var(--green)}
.fold-save{margin:0 0 14px}

</style>

<script>
/* Small Step — 단일 파일 재구현 (수정안 반영) */
(() => {
  const STORE_KEY = 'small-step-state-local';
  const MOODS = ['开心', '平静', '专注', '有成就感', '普通', '有点累', '焦虑', '低落'];
  const DAY_CN = ['日', '一', '二', '三', '四', '五', '六'];
  const EMPTY = { routines: [], days: {}, weeklyNotes: {} };

  const uid = () => `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  const iso = (d = new Date()) => d.toLocaleDateString('sv-SE');
  const weekStart = (dateStr) => {
    const d = new Date(`${dateStr}T12:00:00`);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return iso(d);
  };
  const weekLabel = (startStr) => {
    const a = new Date(`${startStr}T12:00:00`);
    const b = new Date(a); b.setDate(a.getDate() + 6);
    const f = (x) => x.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    return `${f(a)} — ${f(b)}`;
  };
  const minimumOf = (r) => (r.minimum || '').trim() || `${r.minutes || 5} 分钟`;
  const cueOf = (r) => r.time || r.cue || '完成上一件事后';
  const childrenOf = (r, pool) => pool.filter((c) => c.afterId === r.id && !c.time);
  const isChained = (r, pool) => !!(r.afterId && pool.some((p) => p.id === r.afterId));
  const dayOf = (s, key) => s.days[key] || { todos: [], mood: '', moods: [], note: '', thoughts: [] };

  /* ---------- state ---------- */
  let state = load();
  let view = state.routines.length ? 'plan' : 'week';
  let saveState = '已保存';
  let draft = { name: '', startMode: 'trigger', cue: '', time: '', minimum: '', days: [1, 2, 3, 4, 5], afterId: '', slot: '' };
  let ui = { weekOffset: 0, moodInput: false, editDay: null, receiptDay: null, weeklyKey: null, weeklyDraft: '', todoText: '', customMood: '', thought: '', openNote: null, planDate: iso(), planTime: '', planText: '', transfer: '' };

  function normalize(p) {
    const days = {};
    Object.entries(p.days || {}).forEach(([k, v]) => {
      days[k] = { todos: (v && v.todos) || [], mood: (v && v.mood) || '', moods: (v && v.moods) || [],
        note: (v && v.note) || '', thoughts: (v && v.thoughts) || [] };
    });
    const routines = (p.routines || []).map((r) => ({ ...r, days: r.days || [], doneDates: r.doneDates || [],
      notes: r.notes || {}, doneTimes: r.doneTimes || {}, slot: r.slot || '' }));
    return { routines, days, weeklyNotes: p.weeklyNotes || {} };
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return { routines: [], days: {}, weeklyNotes: {} };
      return normalize(JSON.parse(raw));
    } catch { return { routines: [], days: {}, weeklyNotes: {} }; }
  }
  let saveTimer = null;
  function save() {
    saveState = '保存中';
    paintSaveState();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        const now = new Date();
        saveState = `已保存 · ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      } catch { saveState = '保存失败'; }
      paintSaveState();
    }, 400);
  }
  function mutate(fn) { fn(state); save(); render(); }
  function paintSaveState() {
    const el = document.querySelector('.save-state');
    if (!el) return;
    el.className = `save-state ${saveState.startsWith('已保存') ? 'saved' : ''}`;
    el.innerHTML = `<i></i>${saveState}`;
  }

  /* ---------- helpers ---------- */
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v === null || v === undefined) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'style') Object.assign(el.style, v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    kids.flat().forEach((c) => { if (c === null || c === undefined || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return el;
  };
  const weekDates = (startStr) => Array.from({ length: 7 }, (_, i) => {
    const d = new Date(`${startStr}T12:00:00`); d.setDate(d.getDate() + i); return d;
  });

  function weekProgress(startStr) {
    const dates = weekDates(startStr);
    let total = 0, done = 0;
    state.routines.forEach((r) => dates.forEach((d) => {
      if (!r.days.includes(d.getDay())) return;
      total += 1;
      if (r.doneDates.includes(iso(d))) done += 1;
    }));
    return { done, total };
  }

  /* ---------- actions ---------- */
  const nowHM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const toggleDone = (id, date) => mutate((s) => {
    const r = s.routines.find((x) => x.id === id); if (!r) return;
    r.doneTimes = r.doneTimes || {};
    if (r.doneDates.includes(date)) { r.doneDates = r.doneDates.filter((d) => d !== date); delete r.doneTimes[date]; }
    else { r.doneDates = [...r.doneDates, date]; if (date === iso()) r.doneTimes[date] = nowHM(); }
  });
  const setDoneTime = (id, date, time) => mutate((s) => {
    const r = s.routines.find((x) => x.id === id); if (!r) return;
    r.doneTimes = { ...(r.doneTimes || {}), [date]: time };
    if (time && !r.doneDates.includes(date)) r.doneDates = [...r.doneDates, date];
  });
  const toggleTodo = (key, id) => mutate((s) => {
    const d = ensureDay(s, key);
    d.todos = d.todos.map((t) => t.id === id
      ? { ...t, done: !t.done, doneAt: !t.done ? (key === iso() ? nowHM() : (t.doneAt || '')) : '' } : t);
  });
  const setNote = (id, date, text) => mutate((s) => {
    const r = s.routines.find((x) => x.id === id); if (!r) return;

  });
  const ensureDay = (s, key) => { s.days[key] = s.days[key] || { todos: [], mood: '', moods: [], note: '', thoughts: [] }; return s.days[key]; };

  /* ---------- pages ---------- */
  function headerEl() {

    const header = h('header', { class: 'ss-header' },
      h('button', { class: 'ss-logo', onclick: () => { view = state.routines.length ? 'plan' : 'week'; render(); } },
        h('span', { class: 'logo-flower' }), 'Small Step'),

  /* --- 01 builder --- */
  function builderPage() {
    const ws = weekStart(iso());
    const { done, total } = weekProgress(ws);

    const form = h('form', { class: 'multi-form guided-builder', onsubmit: (e) => { e.preventDefault(); addRoutine(); } });

      h('label', { class: 'guided-field' },
        h('b', {}, '01'), h('span', {}, '我想做什么？'),
        h('input', { required: true, value: draft.name, placeholder: '例如：读书、拉伸、整理桌面',

    );

    const startTabs = h('div', { class: 'choice-tabs' },

      h('button', { type: 'button', class: draft.startMode === 'time' ? 'active' : '', onclick: () => { draft.startMode = 'time'; draft.cue = ''; draft.time = ''; render(); } }, '某个时间'));
    const startInput = draft.startMode === 'trigger'
      ? h('input', { required: true, value: draft.cue, placeholder: '例如：喝完咖啡后', oninput: (e) => { draft.cue = e.target.value; } })
      : h('input', { required: true, type: 'time', value: draft.time, oninput: (e) => { draft.time = e.target.value; } });
    const chainPicker = (draft.startMode === 'trigger' && state.routines.length)

          h('div', { class: 'slot-options' },
            ...[['morning', '早上'], ['', '不指定'], ['night', '晚上']].map(([v, label]) =>
              h('button', { type: 'button', class: draft.slot === v ? 'active' : '',
                onclick: () => { draft.slot = v; render(); } }, label))))
      : null;
    form.append(h('fieldset', { class: 'start-choice' },
      h('legend', {}, h('b', {}, '02'), h('span', {}, '什么时候最容易开始？')), startTabs, chainPicker, startInput, slotPicker));

    form.append(h('label', { class: 'guided-field' },

    const presets = h('div', { class: 'day-presets' },

      h('button', { type: 'button', onclick: () => { draft.days = [1, 2, 3, 4, 5]; render(); } }, '工作日'),

    form.append(h('div', { class: 'repeat-field' }, h('span', {}, '想在哪些日子重复？'), presets, h('div', { class: 'day-picks' }, ...dayBtns)));
    form.append(h('button', { class: 'primary', type: 'submit' }, '把这个 Small Step 放进本周 ', h('span', {}, '→')));

    const setSlot = (id, v) => mutate((s) => {

  function addRoutine() {

    mutate((s) => {
      s.routines.push({ id: uid(), name: draft.name.trim(), cue: draft.startMode === 'trigger' ? draft.cue.trim() : '',
        time: draft.startMode === 'time' ? draft.time : '', minimum: draft.minimum.trim() || draft.name.trim(),
        minutes: 5, days: [...draft.days].sort(), doneDates: [], notes: {}, doneTimes: {},
        afterId: draft.startMode === 'trigger' ? draft.afterId : '',
        slot: draft.startMode === 'trigger' ? draft.slot : '' });

    render();

  const agendaCard = (r, key, chained) => h('article', { class: `${r.doneDates.includes(key) ? 'done' : ''} ${chained ? 'chained' : ''}` },

    h('div', {}, h('h3', {}, r.name), h('p', {}, `${cueOf(r)} · ${minimumOf(r)}`)));

  /* --- 02 plan --- */
  function planPage() {
    if (!state.routines.length) return emptyGate('还没有 Small Step。先创建一个，再安排到这一周。');
    const base = new Date(); base.setDate(base.getDate() + ui.weekOffset * 7);
    const ws = weekStart(iso(base));
    const dates = weekDates(ws);
    const today = iso();
    const { done, total } = weekProgress(ws);
    const shift = (n) => { ui.weekOffset += n; const b = new Date(); b.setDate(b.getDate() + ui.weekOffset * 7);
      const w = weekDates(weekStart(iso(b))).map(iso); ui.planDate = w.includes(iso()) ? iso() : w[0]; render(); };
    if (!dates.map(iso).includes(ui.planDate)) ui.planDate = dates.map(iso).includes(today) ? today : iso(dates[0]);

    const legend = h('div', { class: 'routine-legend' }, h('span', {}, 'Small Steps'),
      ...state.routines.map((r, i) => h('p', {}, h('i', {}, i + 1), r.name, h('small', {}, `${cueOf(r)} · ${minimumOf(r)}`))));

      h('input', { class: 'week-plan-time', 'aria-label': '日程时间', type: 'time', value: ui.planTime, oninput: (e) => { ui.planTime = e.target.value; } }),
      h('input', { value: ui.planText, placeholder: '例如：周三牙医、周五买菜', oninput: (e) => { ui.planText = e.target.value; } }),

    const agenda = h('div', { class: 'week-agenda' }, ...dates.map((d) => {

      const byCue = scheduled.filter((r) => !r.time && !isChained(r, scheduled));
      const timed = [
        ...scheduled.filter((r) => !!r.time).map((r) => ({ kind: 'routine', routine: r, time: r.time })),
        ...(dayOf(state, key).todos || []).filter((t) => !!t.time).map((t) => ({ kind: 'extra', todo: t, time: t.time })),
      ].sort((a, b) => a.time.localeCompare(b.time));

      return h('section', { class: key === today ? 'today' : '' },
        h('header', {}, h('div', {}, h('span', {}, `周${DAY_CN[d.getDay()]}`), key === today ? h('b', {}, '今天') : null), h('strong', {}, d.getDate())),
        h('div', { class: 'agenda-day-list' },

            ...byCue.flatMap((r) => [agendaCard(r, key, false), ...childrenOf(r, scheduled).map((c) => agendaCard(c, key, true))])) : null,

          ui.weekOffset !== 0 ? h('button', { type: 'button', class: 'week-back', onclick: () => { ui.weekOffset = 0; ui.planDate = iso(); render(); } }, '回到本周') : null))),
      h('section', { class: 'plan-board' },
        h('header', { class: 'plan-board-head' },
          h('div', {}, h('span', {}, '一周一览'), h('h2', {}, '本周的小行动')),
          h('div', { class: 'plan-progress' }, h('p', {}, h('strong', {}, done), ` / ${total} 次轻轻完成`),
            h('div', {}, h('i', { style: { width: `${total ? Math.round((done / total) * 100) : 0}%` } })))),
        legend, adder, agenda),
      h('div', { class: 'plan-actions' },
        h('button', { onclick: () => { view = 'week'; render(); } }, '← 修改 Small Steps'),
        h('button', { class: 'primary-plan', onclick: () => { view = 'today'; render(); } }, '开始今天 ', h('span', {}, '→'))));
  }

  /* --- 03 today --- */
  function todayPage() {
    if (!state.routines.length) return emptyGate('今天还没有安排。先创建一个 Small Step 吧。');
    const now = new Date();
    const key = iso(now);
    const day = dayOf(state, key);
    const moods = day.moods && day.moods.length ? day.moods : (day.mood ? day.mood.split('、') : []);
    const todayRoutines = state.routines.filter((r) => r.days.includes(now.getDay()));
    const doneCount = todayRoutines.filter((r) => r.doneDates.includes(key)).length;

    const totalAll = todayRoutines.length + day.todos.length;

        h('div', {}, h('h3', {}, r.name), h('p', {}, `${cueOf(r)} · ${minimumOf(r)}`)),
        h('button', { class: 'routine-note-toggle', onclick: () => { ui.openNote = ui.openNote === r.id ? null : r.id; render(); } },
          (r.notes || {})[key] ? '已记录' : '写记录'),
        ui.openNote === r.id ? h('div', { class: 'routine-log' },
          h('label', { for: `routine-note-${r.id}` }, '具体做了什么？'),
          h('input', { id: `routine-note-${r.id}`, value: (r.notes || {})[key] || '',
            placeholder: r.name.includes('读') ? '例如：读了 12–14 页' : '记录数量、内容或感受',
            onchange: (e) => setNote(r.id, key, e.target.value) })) : null)),
      !todayRoutines.length ? h('p', {}, '今天没有设定 Small Step，可以安心休息。') : null);

    const todoPanel = h('section', { class: `list-panel ${day.todos.length ? '' : 'empty-list-panel'}` },
      h('div', { class: 'panel-title' }, h('div', {}, h('span', {}, '01 · 今天的清单'), h('h2', {}, '其他待办')), h('small', {}, `${todoDone}/${day.todos.length}`)),
      h('form', { class: 'todo-input', onsubmit: (e) => { e.preventDefault(); if (!ui.todoText.trim()) return;
        mutate((s) => { ensureDay(s, key).todos.push({ id: uid(), text: ui.todoText.trim(), done: false, time: '' }); }); ui.todoText = ''; render(); } },
        h('input', { value: ui.todoText, placeholder: '今天还要做什么？', oninput: (e) => { ui.todoText = e.target.value; } }), h('button', {}, '+')),
      h('div', { class: 'clean-list' },
        ...day.todos.map((t) => h('article', { class: t.done ? 'done' : '' },
          h('button', { class: 'check', onclick: () => toggleTodo(key, t.id) }, t.done ? '✓' : ''),
          h('span', {}, t.text),
          h('button', { class: 'remove', onclick: () => mutate((s) => { const d = ensureDay(s, key); d.todos = d.todos.filter((x) => x.id !== t.id); }) }, '×'))),
        !day.todos.length ? h('p', { class: 'empty-list' }, 'Small Step 之外的事情可以记在这里。') : null));

    const thoughts = day.thoughts || [];
    const setMood = (m) => mutate((s) => {
      const d = ensureDay(s, key);
      const cur = d.moods && d.moods.length ? d.moods : (d.mood ? d.mood.split('、') : []);

    });

    const feelingPanel = h('aside', { class: `feeling-panel ${!moods.length && !thoughts.length ? 'empty-feeling' : ''}` },
      h('div', { class: 'panel-title' }, h('div', {}, h('span', {}, '02 · 今天的感受'), h('h2', {}, '今天的感想'))),
      h('figure', { class: 'feeling-art', 'aria-hidden': 'true' }, h('img', { alt: '', src: window.__COZY__ })),
      !moods.length && !thoughts.length ? h('p', { class: 'feeling-empty-note' }, '不用一次写完。想到一句就保存一句，之后还可以继续添加。') : null,
      h('label', {}, '今天整体感觉如何？', h('small', {}, '可以多选，也可以自己写')),

                onkeydown: (e) => {
                  if (e.key === 'Enter') { e.preventDefault(); const v = (ui.customMood || '').trim();
                    ui.customMood = ''; ui.moodInput = false; if (v) setMood(v); else render(); }
                  if (e.key === 'Escape') { ui.customMood = ''; ui.moodInput = false; render(); }
                } }),
              h('button', { type: 'button', class: 'mood-write-ok', onclick: () => {
                const v = (ui.customMood || '').trim(); ui.customMood = ''; ui.moodInput = false;
                if (v) setMood(v); else render();

      h('form', { class: 'feeling-form', onsubmit: (e) => { e.preventDefault(); if (!ui.thought.trim()) return;
        mutate((s) => { const d = ensureDay(s, key); d.thoughts = [...(d.thoughts || []), { id: uid(), text: ui.thought.trim() }]; }); ui.thought = ''; render(); } },
        h('label', { for: 'today-thought' }, '留下一句感想'),
        h('textarea', { id: 'today-thought', placeholder: '写一句现在想到的话……', oninput: (e) => { ui.thought = e.target.value; } }, ui.thought),
        h('button', { class: 'save-feeling' }, '保存这一句')),
      thoughts.length ? h('div', { class: 'saved-thoughts' }, ...thoughts.map((t) => h('p', {}, t.text))) : null);

    return h('section', { class: 'today-page' },

  /* --- 04 records --- */
  /* ---------- 영수증 이미지로 저장 ---------- */
  const RC = { paper: '#fffdf6', band: '#f4f4e7', green: '#6b7052', sage: '#c5c99d', rose: '#e3cacc', mustard: '#dcb65a',
    gold: '#847367', ink: '#55514f', muted: '#8b8a7d', line: '#dcd8c6', dot: '#e6e2d4', note: '#f9f7ec' };

  function receiptData(key) {
    const d = new Date(`${key}T12:00:00`);
    const day = dayOf(state, key);
    const scheduled = state.routines.filter((r) => r.days.includes(d.getDay()) || r.doneDates.includes(key) || ((r.notes || {})[key] || '').trim());
    const sortKey = (r, depth = 0) => {
      const own = (r.doneTimes || {})[key] || r.time || '';
      if (own) return own;
      const parent = r.afterId && state.routines.find((x) => x.id === r.afterId);
      if (parent && depth < 4) return `${sortKey(parent, depth + 1)}~`;
      if (r.slot === 'morning') return '00:00';
      if (r.slot === 'night') return 'zz';
      return '99:00';
    };
    const rows = scheduled.map((r) => ({
      plan: r.time || cueOf(r), time: (r.doneTimes || {})[key] || '', done: r.doneDates.includes(key),
      name: r.name, note: ((r.notes || {})[key] || '').trim(), sort: sortKey(r), kind: 'routine',
    }));
    (day.todos || []).forEach((t) => rows.push({ plan: '其他待办', time: t.doneAt || '', done: t.done,
      name: t.text, note: '', sort: t.doneAt || t.time || '99:50', kind: 'todo' }));
    rows.sort((a, b) => (a.sort === b.sort
      ? (a.kind === b.kind ? 0 : (a.kind === 'routine' ? -1 : 1)) : a.sort.localeCompare(b.sort)));
    const notes = [...((day.note || '').trim() ? [day.note.trim()] : []), ...((day.thoughts || []).map((t) => t.text))];
    const stamp = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    return { rows, notes, stamp, mood: day.mood || '未选择心情' };
  }

  function receiptCanvas(key) {
    const { rows, notes, stamp, mood } = receiptData(key);
    const S = 2, W = 900, PAD = 44, PLAN = 190, TIME = 90, COLGAP = 18;
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    if (!ctx) return null;
    const F = (px, w = '400', mono = true) => `${w} ${px}px ${mono
      ? 'ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace'
      : 'Georgia,"Songti SC",serif'}`;
    const wrap = (text, maxW) => {
      const out = []; let line = '';
      for (const ch of text) {
        const t = line + ch;
        if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch; } else line = t;
      }
      if (line) out.push(line);
      return out;
    };
    // 높이 계산
    const noteX = PAD + 26, noteW = W - PAD * 2 - 44;
    ctx.font = F(17, '400', false);
    const noteLines = notes.flatMap((n) => wrap(n, noteW));
    const tableTop = 132;
    const rowH = 42;
    const notesH = noteLines.length ? 30 + noteLines.length * 32 + 22 : 0;
    const H = tableTop + 40 + rows.length * rowH + (notesH ? notesH + 26 : 0) + 40;
    c.width = W * S; c.height = H * S; ctx.scale(S, S);

    // 종이
    ctx.fillStyle = RC.paper; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = RC.band; ctx.fillRect(0, 0, W, 96);
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, '#959871'); g.addColorStop(1, RC.sage);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 5);

    // 헤더
    ctx.fillStyle = RC.green; ctx.font = F(15, '700');
    ctx.save(); ctx.letterSpacing = '3px'; ctx.fillText('SMALL STEP', PAD, 42); ctx.restore();
    ctx.fillStyle = RC.gold; ctx.font = F(19, '700');
    ctx.textAlign = 'right'; ctx.fillText(stamp, W - PAD, 44); ctx.textAlign = 'left';

    // 기분 칩
    ctx.font = F(14, '600');
    const mw = ctx.measureText(mood).width + 30;
    ctx.fillStyle = RC.paper; ctx.strokeStyle = RC.sage; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(PAD, 62, mw, 28, 14); ctx.fill(); ctx.stroke();
    ctx.fillStyle = RC.green; ctx.fillText(mood, PAD + 15, 81);

    // 표 머리
    let y = tableTop;
    ctx.strokeStyle = RC.line; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(PAD, y - 18); ctx.lineTo(W - PAD, y - 18); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = F(11, '700'); ctx.fillStyle = RC.muted;
    ctx.save(); ctx.letterSpacing = '2px';
    ctx.fillText('设计', PAD, y);
    ctx.fillStyle = RC.green;
    ctx.fillText('时间', PAD + PLAN + COLGAP, y);
    ctx.fillText('实际', PAD + PLAN + COLGAP + TIME + COLGAP, y);
    ctx.restore();

    // 세로 구분선
    const divX = PAD + PLAN + COLGAP / 2;
    ctx.strokeStyle = '#d5d0be'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(divX, y - 18); ctx.lineTo(divX, y + 16 + rows.length * rowH); ctx.stroke();

    // 행
    y += 22;
    rows.forEach((r) => {
      const a = r.done ? 1 : .5;
      ctx.globalAlpha = a;
      ctx.font = F(14); ctx.fillStyle = RC.muted;
      let plan = r.plan;
      while (ctx.measureText(plan).width > PLAN - 12 && plan.length > 2) plan = plan.slice(0, -1);
      ctx.fillText(plan, PAD, y + 20);
      ctx.font = F(14, '600'); ctx.fillStyle = r.time ? RC.green : '#a9ae9f';
      ctx.fillText(r.time || '—', PAD + PLAN + COLGAP, y + 20);
      ctx.font = F(15, '500'); ctx.fillStyle = RC.ink;
      const nx = PAD + PLAN + COLGAP + TIME + COLGAP;
      ctx.fillText(r.name, nx, y + 20);
      if (r.note) {
        const w2 = ctx.measureText(r.name).width;
        ctx.font = F(13); ctx.fillStyle = RC.muted;
        ctx.fillText(r.note, nx + w2 + 14, y + 20);
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = RC.dot; ctx.setLineDash([1, 3]);
      ctx.beginPath(); ctx.moveTo(PAD, y + rowH - 8); ctx.lineTo(W - PAD, y + rowH - 8); ctx.stroke();
      ctx.setLineDash([]);
      y += rowH;
    });

    // 감상 — 메모지
    if (noteLines.length) {
      y += 26;
      ctx.fillStyle = RC.note;
      ctx.beginPath(); ctx.roundRect(PAD, y, W - PAD * 2, notesH, [0, 12, 12, 0]); ctx.fill();
      ctx.fillStyle = RC.mustard; ctx.fillRect(PAD, y, 7, notesH);
      ctx.fillStyle = RC.gold; ctx.font = F(11, '700');
      ctx.save(); ctx.letterSpacing = '2px'; ctx.fillText('留下的句子', noteX, y + 22); ctx.restore();
      ctx.font = F(17, '400', false); ctx.fillStyle = RC.ink;
      noteLines.forEach((l, i) => {
        const ly = y + 30 + (i + 1) * 32;
        ctx.strokeStyle = '#dcdcc4'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(noteX, ly + 7); ctx.lineTo(W - PAD - 20, ly + 7); ctx.stroke();
        ctx.fillStyle = RC.ink; ctx.fillText(l, noteX, ly);
      });
    }

    // 지그재그 밑단
    ctx.fillStyle = '#efece0';
    for (let x = 0; x < W; x += 18) {
      ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + 9, H - 11); ctx.lineTo(x + 18, H);
      ctx.closePath(); ctx.fill();
    }

    return c;
  }

  function saveCanvas(c, name) {
    if (!c) return;
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png');
    a.download = name;
    document.body.append(a); a.click(); a.remove();
  }
  /* 주간 표지 — 동그라미 매트릭스 / 마무리 — 이번 주 집계 */
  function weekSheetCanvas(ws, kind) {
    const S = 2, W = 900, PAD = 44;
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    if (!ctx) return null;
    const F = (px, w = '400', mono = true) => `${w} ${px}px ${mono
      ? 'ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace'
      : 'Georgia,"Songti SC",serif'}`;
    const dates = weekDates(ws), keys = dates.map(iso);
    const routines = state.routines.filter((r) => r.days.length);
    const weekCount = (r) => r.doneDates.filter((d) => keys.includes(d)).length;
    const rowH = kind === 'matrix' ? 54 : 50;
    const H = 150 + 34 + routines.length * rowH + (kind === 'summary' ? 76 : 0) + 44;
    c.width = W * S; c.height = H * S; ctx.scale(S, S);

    ctx.fillStyle = RC.paper; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = RC.band; ctx.fillRect(0, 0, W, 96);
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, '#959871'); g.addColorStop(1, RC.sage);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 5);

    ctx.fillStyle = RC.green; ctx.font = F(15, '700');
    ctx.save(); ctx.letterSpacing = '3px';
    ctx.fillText(kind === 'matrix' ? 'SMALL STEP · 本周记录' : 'SMALL STEP · 本周合计', PAD, 42);
    ctx.restore();
    ctx.fillStyle = RC.gold; ctx.font = F(17, '700');
    ctx.textAlign = 'right'; ctx.fillText(weekLabel(ws), W - PAD, 44); ctx.textAlign = 'left';

    if (kind === 'matrix') {
      const colW = 62, gridR = W - PAD, gridL = gridR - colW * 7 + 20;
      ctx.font = F(13); ctx.fillStyle = RC.muted; ctx.textAlign = 'center';
      dates.forEach((d, i) => ctx.fillText(`周${DAY_CN[d.getDay()]}`, gridL + i * colW, 128));
      ctx.textAlign = 'left';
      let y = 150;
      routines.forEach((r) => {
        y += rowH;
        ctx.fillStyle = RC.ink; ctx.font = F(15, '500');
        let nm = r.name;
        while (ctx.measureText(nm).width > gridL - PAD - 60 && nm.length > 2) nm = nm.slice(0, -1);
        ctx.fillText(nm === r.name ? nm : `${nm}…`, PAD, y + 5);
        dates.forEach((d, i) => {
          const on = r.days.includes(d.getDay());
          const done = r.doneDates.includes(keys[i]);
          const cx = gridL + i * colW, cy = y;
          if (done) { ctx.fillStyle = '#6b7052'; ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill(); }
          else if (on) { ctx.strokeStyle = '#cfcbb9'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.stroke(); }
          else { ctx.fillStyle = '#e6e2d4'; ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill(); }
        });
        ctx.strokeStyle = RC.dot; ctx.beginPath();
        ctx.moveTo(PAD, y + rowH - 26); ctx.lineTo(W - PAD, y + rowH - 26); ctx.stroke();
      });
    } else {
      const total = routines.reduce((n, r) => n + weekCount(r), 0);
      ctx.fillStyle = '#6b7052'; ctx.font = F(56, '700');
      ctx.fillText(String(total), PAD, 168);
      const nw = ctx.measureText(String(total)).width;
      ctx.fillStyle = RC.muted; ctx.font = F(16);
      ctx.fillText(' 次轻轻完成', PAD + nw + 10, 166);
      let y = 196;
      routines.forEach((r) => {
        y += rowH;
        ctx.fillStyle = RC.ink; ctx.font = F(15, '500');
        ctx.fillText(r.name, PAD, y);
        ctx.fillStyle = RC.muted; ctx.font = F(12);
        ctx.fillText(`${cueOf(r)} · ${minimumOf(r)}`, PAD, y + 19);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#6b7052'; ctx.font = F(19, '700');
        ctx.fillText(`${weekCount(r)} 次`, W - PAD, y + 6);
        ctx.textAlign = 'left';
        ctx.strokeStyle = RC.dot; ctx.beginPath();
        ctx.moveTo(PAD, y + rowH - 22); ctx.lineTo(W - PAD, y + rowH - 22); ctx.stroke();
      });
    }

    ctx.fillStyle = '#efece0';
    for (let x = 0; x < W; x += 18) {
      ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + 9, H - 11); ctx.lineTo(x + 18, H);
      ctx.closePath(); ctx.fill();
    }
    return c;
  }

  // 저장용 3:4 세로 프레임 (화면 표시는 그대로)
  function frame34(content) {
    if (!content) return null;
    const S = 2, W = 1080, H = 1440, PAD = 54;
    const out = document.createElement('canvas');
    out.width = W * S; out.height = H * S;
    const ctx = out.getContext('2d');
    if (!ctx) return content;
    ctx.scale(S, S);
    ctx.fillStyle = '#efece2'; ctx.fillRect(0, 0, W, H);

    const cw = content.width / S, ch = content.height / S;
    const scale = Math.min((W - PAD * 2) / cw, (H - PAD * 2) / ch);
    const dw = cw * scale, dh = ch * scale;
    const x = (W - dw) / 2, y = (H - dh) / 2;

    ctx.save();
    ctx.shadowColor = 'rgba(48,56,44,.16)';
    ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
    ctx.fillStyle = '#fffdf6';
    ctx.fillRect(x, y, dw, dh);
    ctx.restore();
    ctx.drawImage(content, x, y, dw, dh);
    return out;
  }
  const downloadReceipt = (key) => saveCanvas(frame34(receiptCanvas(key)), `small-step-${key}.png`);

  function downloadWeekReceipts(ws) {
    // 실제로 기록이 남은 날만 (예정만 있는 날은 제외)
    const keys = weekDates(ws).map(iso).filter((k) => {
      const { rows, notes } = receiptData(k);
      const day = dayOf(state, k);
      return rows.some((r) => r.done) || notes.length || (day.todos || []).length || !!day.mood;
    });
    if (!keys.length) return 0;
    const pages = [
      () => weekSheetCanvas(ws, 'matrix'),
      ...keys.map((k) => () => receiptCanvas(k)),
      () => weekSheetCanvas(ws, 'summary'),
    ];
    pages.forEach((make, i) => setTimeout(() => {
      saveCanvas(frame34(make()), `small-step-${ws}-${String(i + 1).padStart(2, '0')}.png`);
    }, i * 400));
    return pages.length;
  }

        h('form', { class: 'edit-add', onsubmit: (e) => { e.preventDefault();
          const v = (ui.editThought || '').trim(); if (!v) return; ui.editThought = '';
          mutate((s) => { const dd = ensureDay(s, key); dd.thoughts = [...(dd.thoughts || []), { id: uid(), text: v }]; }); } },
          h('input', { value: ui.editThought || '', placeholder: '补一句当天的感想', oninput: (e) => { ui.editThought = e.target.value; } }),
          h('button', {}, '+'))));
  }

  function recordCard(key) {
    return h('div', { class: 'record-card-wrap' },
      receiptBlock(key),
      ui.editDay === key ? editDrawer(key) : null);
  }

  function recordsPage() {
    const ws = weekStart(iso());
    const dates = weekDates(ws);
    const allDays = Object.entries(state.days).sort((a, b) => b[0].localeCompare(a[0]));
    const blank = !state.routines.length && !allDays.length;

    const thisWeek = allDays.filter(([k]) => weekStart(k) === ws);
    const past = {};
    allDays.filter(([k]) => weekStart(k) !== ws).forEach(([k, v]) => { (past[weekStart(k)] = past[weekStart(k)] || []).push([k, v]); });
    const stepDone = state.routines.reduce((n, r) => n + r.doneDates.length, 0);
    const todoDone = allDays.reduce((n, [, d]) => n + d.todos.filter((t) => t.done).length, 0);
    const reflections = thisWeek.filter(([, d]) => (d.thoughts || []).length || (d.note || '').trim());

    return h('section', { class: 'records-page' },
      h('div', { class: 'records-heading' },
        h('div', {}, h('span', { class: 'step-label' }, '全部记录'), h('h1', { html: '走过的小步，<br><em>都留在这里。</em>' })),
        h('div', { class: 'record-stats' },
          h('div', {}, h('strong', {}, stepDone), h('span', {}, 'Small Step 完成')),
          h('div', {}, h('strong', {}, todoDone), h('span', {}, '待办完成')),
          h('div', {}, h('strong', {}, allDays.length), h('span', {}, '有记录的日子')))),
      h('section', { class: 'record-transfer' },
        h('div', {}, h('span', {}, '记录备份'), h('h2', {}, '带走记录，也能随时放回来'),
          h('p', {}, '导出包含 Small Steps、完成日期、待办、感受和每周感想。导入时会与现有记录安全合并。')),
        h('div', { class: 'record-transfer-actions' },
          h('button', { type: 'button', onclick: exportJson }, '↓ 导出记录'),
          h('label', {}, '↑ 导入记录', h('input', { type: 'file', accept: 'application/json,.json', onchange: (e) => { const f = e.target.files[0]; e.target.value = ''; importJson(f); } }))),
        ui.transfer ? h('p', { class: 'record-transfer-status', role: 'status' }, ui.transfer) : null),
      blank ? h('section', { class: 'ss-empty-gate' },
        h('p', {}, '还没有记录。完成第一个小行动后，这里会留下痕迹。'),
        h('p', { class: 'gate-hint' }, '已经有备份文件的话，可以直接用上面的「↑ 导入记录」放回来。'),
        h('button', { class: 'primary', onclick: () => { view = 'week'; render(); } }, '创建第一个 Small Step')) : null,
      blank ? null : h('section', { class: 'reflection-archive current-reflections' },
        h('div', { class: 'reflection-title' }, h('span', {}, '本周 · 感想'), h('h2', {}, '本周感想记录'), h('p', {}, `${weekLabel(ws)}，只看这一周留下的感受。`)),
        h('div', { class: 'reflection-list' },
          ...reflections.map(([k, d]) => h('article', {},
            h('header', {}, h('time', {}, new Date(`${k}T12:00:00`).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' })), h('b', {}, d.mood)),
            h('div', { class: 'reflection-thoughts' }, ...[...((d.note || '').trim() ? [{ id: 'l', text: d.note.trim() }] : []), ...(d.thoughts || [])].map((t) => h('p', {}, t.text))))),
          !reflections.length ? h('p', { class: 'empty-reflections' }, '这周还没有写下感想。') : null),
        (() => {
          const stored = (state.weeklyNotes || {})[ws] || '';
          const shown = ui.weeklyKey === ws ? ui.weeklyDraft : stored;
          const dirty = shown !== stored;
          return h('div', { class: 'weekly-reflection' },
            h('label', { for: 'weekly-reflection' }, '一周感想'),
            h('textarea', { id: 'weekly-reflection', placeholder: '回看这一周：什么变得容易了？下周想保留什么？',
              oninput: (e) => {
                ui.weeklyKey = ws; ui.weeklyDraft = e.target.value;
                const btn = document.querySelector('.weekly-save');
                if (btn) { const same = e.target.value === stored; btn.disabled = same; btn.textContent = same && stored ? '已保存' : '保存感想'; }
              } }, shown),
            h('div', { class: 'weekly-reflection-actions' },
              h('button', { type: 'button', class: 'weekly-save', disabled: !dirty, onclick: () => {
                const v = document.getElementById('weekly-reflection').value;
                ui.weeklyKey = null; ui.weeklyDraft = '';
                mutate((s) => { s.weeklyNotes = { ...(s.weeklyNotes || {}), [ws]: v }; });
              } }, !dirty && stored ? '已保存' : '保存感想')));
        })()),
      blank ? null : h('section', { class: 'current-week-records' },
        h('div', { class: 'record-list-title' }, h('span', {}, '本周'), h('h2', {}, '本周记录'), h('p', {}, weekLabel(ws)),
          h('button', { class: 'week-save-all', onclick: (e) => {
            const n = downloadWeekReceipts(ws);
            e.target.textContent = n ? `保存中… ${n} 张` : '这周还没有记录';
            setTimeout(() => { e.target.textContent = '↓ 保存本周图片'; }, 2200);
          } }, '↓ 保存本周图片')),
        h('section', { class: 'routine-matrix records-matrix' },
          h('div', { class: 'matrix-head' }, h('span', {}, 'Small Steps'), ...dates.map((d) => h('b', {}, `周${DAY_CN[d.getDay()]}`))),
          ...state.routines.map((r) => h('div', { class: 'matrix-row' }, h('strong', { title: r.name }, r.name),
            ...dates.map((d) => { const k = iso(d); const on = r.days.includes(d.getDay()); const done = r.doneDates.includes(k);
              return h('button', { disabled: !on, class: done ? 'done' : '', onclick: () => on && toggleDone(r.id, k) }, done ? '✓' : (on ? '' : '·')); })))),
        h('div', { class: 'daily-record-heading' }, h('span', {}, '每日记录'), h('h3', {}, '每日详细记录')),
        ...thisWeek.map(([k]) => recordCard(k)),
        !thisWeek.length ? h('p', { class: 'empty-records' }, '这周的 Small Steps、待办和感想会出现在这里。') : null),
      blank ? null : (() => {
        const weekKeys = dates.map(iso);
        const weekCount = (r) => r.doneDates.filter((d) => weekKeys.includes(d)).length;
        const weekTotal = state.routines.reduce((n, r) => n + weekCount(r), 0);
        return h('section', { class: 'routine-summary always-open' },
          h('div', {}, h('span', {}, '本周小行动'), h('h2', { html: 'Small Step<br>本周' }),
            h('p', {}, `${weekTotal} 次完成`), h('small', { class: 'summary-range' }, weekLabel(ws))),
          h('div', { class: 'summary-list' }, ...state.routines.map((r) => h('article', {},
            h('div', {}, h('h3', {}, r.name), h('p', {}, `${cueOf(r)} · ${minimumOf(r)}`)),
            h('strong', {}, weekCount(r), h('small', {}, ' 次'))))));
      })(),
      blank ? null : h('section', { class: 'past-weeks' },
        h('div', { class: 'past-weeks-title' }, h('span', {}, '每周归档'), h('h2', {}, '以前的周'), h('p', {}, '按周收好，点击后查看每天。')),
        ...Object.entries(past).sort((a, b) => b[0].localeCompare(a[0])).map(([k, list]) => h('details', { class: 'week-fold' },
          h('summary', {}, h('div', {}, h('strong', {}, weekLabel(k)), h('span', {}, `${list.length} 天有记录`)),
            h('p', {}, (state.weeklyNotes || {})[k] || '点击查看这一周的每日记录'), h('i', {}, '＋')),
          h('div', { class: 'week-fold-content' },
            h('button', { class: 'week-save-all fold-save', onclick: (e) => {
              const n = downloadWeekReceipts(k);
              e.target.textContent = n ? `保存中… ${n} 张` : '没有记录';
              setTimeout(() => { e.target.textContent = '↓ 保存这一周图片'; }, 2200);
            } }, '↓ 保存这一周图片'),
            ...list.map(([kk]) => recordCard(kk))))),
        !Object.keys(past).length ? h('p', { class: 'empty-records' }, '下周开始后，本周记录会自动收进这里。') : null));
  }

  function exportJson() {
    const blob = new Blob([JSON.stringify({ format: 'small-step-records', version: 1, exportedAt: new Date().toISOString(), state }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `small-step-records-${iso()}.json`;
    document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    ui.transfer = '记录文件已下载。'; render();
  }
  async function importJson(file) {
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      const raw = parsed.state || parsed;
      if (!raw || !raw.days || !Array.isArray(raw.routines)) throw new Error('invalid');
      const incoming = normalize(raw);
      mutate((s) => {
        const map = new Map(s.routines.map((r) => [r.id, r]));
        incoming.routines.forEach((r) => {
          const cur = map.get(r.id);
          map.set(r.id, cur ? { ...cur, ...r, doneDates: [...new Set([...cur.doneDates, ...r.doneDates])], notes: { ...(cur.notes || {}), ...(r.notes || {}) } } : r);
        });
        s.routines = [...map.values()];
        Object.entries(incoming.days).forEach(([k, v]) => {
          const cur = s.days[k];
          s.days[k] = cur ? { ...cur, ...v, todos: [...cur.todos, ...v.todos.filter((t) => !cur.todos.some((c) => c.id === t.id))],
            thoughts: [...(cur.thoughts || []), ...((v.thoughts || []).filter((t) => !(cur.thoughts || []).some((c) => c.id === t.id)))] } : v;
        });
        s.weeklyNotes = { ...(s.weeklyNotes || {}), ...(incoming.weeklyNotes || {}) };
      });
      ui.transfer = `已合并 ${Object.keys(incoming.days).length} 天记录和 ${incoming.routines.length} 个 Small Steps。`;
    } catch { ui.transfer = '导入失败，请选择从 Small Step 导出的 JSON 文件。'; }
    render();
  }

  /* ---------- render ---------- */
  function footerEl() {
    const map = { week: ['查看本周安排', 'plan'], plan: ['开始今天', 'today'], today: ['查看本周计划', 'plan'], records: ['回到今天', 'today'] };
    const [label, target] = map[view];
    const blocked = !state.routines.length;
    return h('footer', {}, h('span', {}, 'Small Step'), h('p', {}, '把小行动，轻轻重复。'),
      blocked ? null : h('button', { onclick: () => { view = target; render(); } }, label));
  }

  function render() {
    const root = document.getElementById('root');
    const page = view === 'week' ? builderPage() : view === 'plan' ? planPage() : view === 'today' ? todayPage() : recordsPage();
    root.replaceChildren(h('main', { class: 'small-step-app' }, headerEl(), page, footerEl()));
  }

  render();
})();

</script>
</body>
</html>
